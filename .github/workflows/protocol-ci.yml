name: SolCage protocol CI

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - "programs/**"
      - ".github/workflows/protocol-ci.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile and run protocol math tests
        run: cargo test --workspace --lib
      - name: Lint program
        run: cargo clippy --workspace --all-targets -- -D warnings

  sbf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SBF_TOOLS_VERSION: v1.54
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Solana toolchain
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.10/install)"
      - name: Add Solana tools to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          solana --version
          cargo build-sbf --version
      - name: Build deployable SBF program
        run: |
          cargo build-sbf \
            --manifest-path programs/solcage_lending/Cargo.toml \
            --tools-version "$SBF_TOOLS_VERSION" \
            --sbf-out-dir target/deploy
          test -s target/deploy/solcage_lending.so
          sha256sum target/deploy/solcage_lending.so
      - name: Upload SBF artifact
        uses: actions/upload-artifact@v4
        with:
          name: solcage-lending-sbf-${{ github.sha }}
          path: |
            target/deploy/solcage_lending.so
            Anchor.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 14
